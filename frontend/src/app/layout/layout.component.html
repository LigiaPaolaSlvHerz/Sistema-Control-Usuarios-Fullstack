<div class="layout-wrapper flex flex-column h-screen overflow-hidden relative">

    <div class="layout-topbar flex align-items-center justify-content-between px-4 surface-card"
         style="border-bottom: 3px solid var(--naranja-login); min-height: 70px;">

        <div class="flex align-items-center">
            <p-button
                icon="pi pi-bars"
                (click)="visible = !visible"
                [text]="true"
                severity="secondary"
                class="lg:hidden mr-2">
            </p-button>

            <div class="flex align-items-center py-2 gap-3">
                <img src="/logosegiaguag.png" alt="Logo" style="width: 40px; border-radius: 8px;">
                <span class="font-bold text-xl vertical-align-middle">SEGIAGUA</span>
            </div>
        </div>

        <div class="flex align-items-center gap-3">
            <p-button icon="pi pi-bell" [rounded]="true" [text]="true" severity="secondary"></p-button>
            <p-button (click)="cerrarSesion()" label="Salir" icon="pi pi-sign-out"
                      severity="danger" [outlined]="true" size="small"></p-button>
        </div>
    </div>

    <div class="flex flex-row flex-grow-1 relative">

        <div *ngIf="visible"
             class="layout-mask lg:hidden"
             (click)="visible = false">
        </div>

        <!-- SIDEBAR ÚNICO (Para PC y Móvil) -->
        <!-- En PC (lg) siempre está activo. En móvil depende de 'active-mobile' -->
        <div class="layout-sidebar surface-section shadow-1 flex flex-column w-18rem flex-shrink-0"
             [ngClass]="{'active-mobile': visible}">

            <ng-container *ngTemplateOutlet="menuContent"></ng-container>
        </div>

        <main class="flex-grow-1 p-3 md:p-4" style="overflow-y: auto; background-color: var(--fondo-claro); height: 100%; ">
            <router-outlet></router-outlet>
        </main>

    </div>
</div>

<ng-template #menuContent>
    <div class="flex align-items-center p-3 border-bottom-1 surface-border" style="border-color: rgba(255,255,255,0.2) !important;">
        <div class="avatar-circle flex align-items-center justify-content-center border-circle font-bold mr-3"
             style="width: 48px; height: 48px;">
            {{ userInitial }}
        </div>

        <div class="flex flex-column">
            <span class="font-bold text-xl text-white">
                {{ userName }}
            </span>
            <span class="text-sm text-white opacity-70">
                {{ fullName }}
            </span>
        </div>
    </div>

    <div class="p-3 flex-grow-1">
        <ul class="list-none p-0 m-0">
            <li class="mb-2">
                <a routerLink="/principal" (click)="visible = false" class="menu-item flex align-items-center p-3 cursor-pointer no-underline">
                    <i class="pi pi-home mr-2 text-white"></i>
                    <span class="font-medium text-white">Inicio</span>
                </a>
            </li>
            <li class="mb-2">
                <a routerLink="/usuarios" (click)="visible = false" class="menu-item flex align-items-center p-3 cursor-pointer no-underline">
                    <i class="pi pi-users mr-2 text-white"></i>
                    <span class="font-medium text-white">Gestión de Usuarios</span>
                </a>
            </li>
            <li class="mb-2">
                <a routerLink="/roles" (click)="visible = false" class="menu-item flex align-items-center p-3 cursor-pointer no-underline">
                    <i class="pi pi-shield mr-2 text-white"></i>
                    <span class="font-medium text-white">Gestión de Roles</span>
                </a>
            </li>
            <li class="mb-2">
                <a routerLink="/permisos" (click)="visible = false" class="menu-item flex align-items-center p-3 cursor-pointer no-underline">
                    <i class="pi pi-pen-to-square mr-2 text-white"></i>
                    <span class="font-medium text-white">Gestión de Permisos</span>
                </a>
            </li>
        </ul>
    </div>
</ng-template>
