<div class="card p-4 shadow-2 border-round">
  <h3>🌦️ Monitor de Clima SEGIAGUA</h3>

  <div class="grid p-fluid">
    <div class="col-12 md:col-6">
      <label>Selecciona Alcaldía</label>
      <p-dropdown [options]="alcaldias" [(ngModel)]="alcaldiaSeleccionada"
                  optionLabel="municipality" placeholder="Elegir alcaldía"
                  (onChange)="onAlcaldiaChange()">
      </p-dropdown>
    </div>

    <div class="col-12 md:col-6">
      <label>Selecciona Colonia</label>
      <p-dropdown [options]="colonias" [(ngModel)]="coloniaSeleccionada"
                  optionLabel="settlement" placeholder="Elegir colonia"
                  [disabled]="!colonias.length">
      </p-dropdown>
    </div>
  </div>

  <div class="mt-4">
     <p>
       Coordenadas: {{coloniaSeleccionada.latitude}}, {{coloniaSeleccionada.longitude}}
     </p>
  </div>
</div>
