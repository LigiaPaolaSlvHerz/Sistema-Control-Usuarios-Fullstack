<div class="bg-white shadow-lg rounded-xl p-5 mb-8 mx-4" style="overflow: visible;">
  <h3>🌦️ Monitor de Clima SEGIAGUA</h3>

  <div class="grid m-0">
    <div class="col-12 md:col-6 flex flex-column gap-2">
      <label>Selecciona Alcaldía</label>
      <p-dropdown [options]="alcaldias" [(ngModel)]="alcaldiaSeleccionada"
                  optionLabel="municipality" placeholder="Seleccionar alcaldía"
                  (onChange)="onAlcaldiaChange()" [style]="{'width': '100%', 'max-width': '400px'}">
      </p-dropdown>
    </div>

    <div class="col-12 md:col-6 flex flex-column gap-2">
      <label>Selecciona Colonia</label>
      <p-dropdown [options]="colonias" [(ngModel)]="coloniaSeleccionada"
                  optionLabel="settlement" placeholder="Seleccionar colonia"
                  [disabled]="!colonias.length" [style]="{'width': '100%', 'max-width': '400px'}"
                  (onChange)="onColoniaChange()">
      </p-dropdown>
    </div>
  </div>

  <!-- @if (coloniaSeleccionada) {
    <div class="mt-4">
      <p>Coordenadas: {{coloniaSeleccionada.latitude}}, {{coloniaSeleccionada.longitude}}</p>
    </div>
  } -->
  <!-- class="bg-white p-4 shadow-lg rounded-xl flex flex-col h-[400px]" -->
  <div class="grid mt-4">
    <div class="col-12 md:col-6">
      <div class="chart-card bg-white p-4 shadow-lg rounded-xl">
        <h4 class="text-center font-bold text-gray-700 mb-2 shrink-0">Monitor Térmico y Humedad</h4>
        <div class="chart-container">
          <canvas baseChart
            [data]="lineChartData"
            [options]="lineChartOptions"
            [type]="'line'">
          </canvas>
        </div>
      </div>
    </div>
    <div class="col-12 md:col-6">
      <div class="chart-card bg-white p-4 shadow-lg rounded-xl">
        <h4 class="text-center font-bold text-gray-700 mb-2 shrink-0">Probabilidad de precipitacion</h4>
        <div class="chart-container">
          <canvas baseChart
            [data]="probabilidadChartData"
            [options]="probabilidadChartOptions"
            [type]="'line'">
          </canvas>
        </div>
      </div>
    </div>
    <div class="col-12 md:col-6">
      <div class="chart-card bg-white p-4 shadow-lg rounded-xl">
        <h4 class="text-center font-bold text-gray-700 mb-2 shrink-0">Weather code</h4>
        <div class="chart-container">
          <canvas baseChart
            [data]="weatherCodeChartData"
            [options]="weatherCodeChartOptions"
            [type]="'bar'">
          </canvas>
        </div>
      </div>
    </div>
    <div class="col-12 md:col-6">
      <div class="chart-card bg-white p-4 shadow-lg rounded-xl">
        <h4 class="text-center font-bold text-gray-700 mb-2 shrink-0">Lluvia</h4>
        <div class="chart-container">
          <canvas baseChart
            [data]="lluviaChartData"
            [options]="lluviaChartOptions"
            [type]="'line'">
          </canvas>
        </div>
      </div>
    </div>
  </div>
</div>
