<div class="card p-4">
    <h2 class="text-center text-orange-600 font-bold mb-4">Administración de Roles</h2>

    <div class="flex justify-content-end mb-3">
        <p-button label="Nuevo Rol" icon="pi pi-plus-circle" severity="success" (onClick)="showDialog()"></p-button>
    </div>

    <p-dialog [header]="isEditMode ? 'Editar Rol' : 'Registrar Nuevo Rol'" [(visible)]="display" [modal]="true" [style]="{ width: '500px' }">
        <div class="flex flex-column gap-3">
            <label class="font-bold">Nombre del Rol</label>
            <input pInputText placeholder="Ej. Administrador" [(ngModel)]="nuevoRol.role" />
            <label class="font-bold text-orange-600 mt-2">Asignar Permisos</label>

            <div class="surface-ground p-3 border-round" style="max-height: 250px; overflow-y: auto;">
                <div class="grid">
                    <div *ngFor="let p of permisosDisponibles" class="col-12 md:col-6 flex align-items-center gap-2 mb-2">
                        <p-checkbox
                            [value]="p.id"
                            [(ngModel)]="nuevoRol.permisos"
                            [inputId]="p.id">
                        </p-checkbox>
                        <label [for]="p.id" class="text-sm cursor-pointer">{{ p.permission }}</label>
                    </div>
                </div>
                <small *ngIf="permisosDisponibles.length === 0" class="text-gray-500">Cargando permisos...</small>
            </div>

            <div class="flex justify-content-end mt-2">
                <p-button [label]="isEditMode ? 'Actualizar' : 'Guardar'" icon="pi pi-check" (onClick)="guardarRol()"></p-button>
            </div>
        </div>
    </p-dialog>

    <div style="width: 100%; overflow-x: auto;">
        <p-table
            #dt
            [value]="roles"
            dataKey="id"
            [rows]="5"
            [paginator]="true"
            [globalFilterFields]="['role']"
            [scrollable]="true"
            styleClass="p-datatable-gridlines p-datatable-striped"
            [tableStyle]="{ 'min-width': '40rem' }"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 50%">Nombre del Rol</th>
                    <th style="width: 20%">Estatus</th>
                    <th style="width: 20%" class="text-center">Acciones</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-rol>
                <tr>
                    <td>{{ rol.id }}</td>
                    <td><span class="font-bold text-primary">{{ rol.role | uppercase }}</span></td>
                    <td>
                        <p-tag [value]="rol.status | uppercase" [severity]="getSeverity(rol.status)"></p-tag>
                    </td>
                    <td class="text-center">
                        <p-button icon="pi pi-pencil" [rounded]="true" severity="warn" [outlined]="true" class="mr-2" (onClick)="editarRol(rol)"></p-button>
                        <p-button icon="pi pi-trash" [rounded]="true" severity="danger" [outlined]="true" (onClick)="confirmarEliminacion(rol)"></p-button>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4" class="text-center p-4">No se encontraron registros de roles para SEGIAGUA.</td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-confirmDialog></p-confirmDialog>
